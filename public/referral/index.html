<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Each link is private to the people it was sent to. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Rescue Referral — ResPAWnd</title>
    <link rel="icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tilt+Warp&family=Zain:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        /* Same palette as the app (lib/app_theme.dart) and /tag. */
        :root {
          --background: #FBF9F4;
          --yellow: #FFD95E;
          --green: #C2B500;
          --slate: #D9D9D9;
          --tea: #E3E0B9;
          --text-primary: #393207;
          --text-secondary: #7E7D76;
          --surface: #FFFFFF;
          --error: #E05353;
          --warning: #E0A030;
          --success: #4CAF6D;
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          background: var(--background);
          color: var(--text-primary);
          font-family: "Zain", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
          font-size: 16px;
          -webkit-font-smoothing: antialiased;
        }
        .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; min-height: 100vh; }
        .center-screen {
          min-height: 80vh; display: flex; align-items: center; justify-content: center;
          text-align: center; padding: 24px;
        }
        h1, h2, h3 { font-family: "Tilt Warp", sans-serif; font-weight: 400; margin: 0; }
        h1 { font-size: 26px; }
        h2 { font-size: 18px; margin-bottom: 10px; }
        .muted { color: var(--text-secondary); }
        .brand { font-family: "Tilt Warp", sans-serif; font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
        .chip {
          display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 14px; font-weight: 700;
          background: var(--tea); color: var(--text-primary);
        }
        .chip.critical { background: rgba(224, 83, 83, 0.15); color: var(--error); }
        .chip.medium { background: rgba(224, 160, 48, 0.18); color: #9a6a12; }
        .chip.status { background: var(--yellow); }
        .card {
          background: var(--surface); border: 1px solid var(--slate); border-radius: 14px;
          padding: 16px; margin-top: 14px;
        }
        .row { display: flex; gap: 12px; padding: 4px 0; font-size: 16px; }
        .row .k { flex: 0 0 120px; color: var(--text-secondary); }
        .row .v { flex: 1; font-weight: 700; word-break: break-word; white-space: pre-line; }
        .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
        .photos a { display: block; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--tea); }
        .photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
        video { width: 100%; border-radius: 10px; margin-top: 8px; background: #000; }
        .animal + .animal { border-top: 1px solid var(--slate); margin-top: 8px; padding-top: 8px; }
        .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .btn {
          display: inline-flex; align-items: center; justify-content: center; gap: 6px;
          min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--text-primary);
          background: var(--surface); color: var(--text-primary); font: inherit; font-weight: 700;
          text-decoration: none; cursor: pointer;
        }
        .btn.primary { background: var(--yellow); border-color: var(--yellow); }
        .btn[disabled] { opacity: 0.5; cursor: default; }
        .choice { display: grid; gap: 8px; margin: 6px 0 12px; }
        .choice label {
          display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px;
          border: 1px solid var(--slate); cursor: pointer; font-weight: 700;
        }
        .choice input { accent-color: var(--text-primary); width: 18px; height: 18px; }
        .choice label:has(input:checked) { border-color: var(--text-primary); background: rgba(255, 217, 94, 0.25); }
        .field { display: block; margin-bottom: 10px; }
        .field span { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
        .field input, .field textarea {
          width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px;
          border: 1px solid var(--slate); background: var(--surface); color: var(--text-primary);
        }
        .field textarea { min-height: 90px; resize: vertical; }
        .error { color: var(--error); font-weight: 700; margin: 6px 0; }
        .success { color: var(--success); font-weight: 700; margin: 6px 0; }
        .answer + .answer { border-top: 1px solid var(--slate); margin-top: 8px; padding-top: 8px; }
        .spinner {
          width: 36px; height: 36px; border-radius: 50%; margin: 0 auto 12px;
          border: 4px solid var(--tea); border-top-color: var(--text-primary); animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .foot { text-align: center; font-size: 14px; color: var(--text-secondary); margin-top: 22px; }
    </style>
</head>
<body>
<div id="app" class="wrap"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

    // Same web config as lib/firebase_options.dart and /tag. The page reads
    // nothing from Firestore: getReferralShare (functions/referral_shares.js)
    // returns a copy of the report for this link's token.
    const app = initializeApp({
      apiKey: "AIzaSyCJcdSf3qyq9C-JRByBWxxnyE6Kp37XLtE",
      appId: "1:790537497506:web:797389d4b5f5664726e0fb",
      messagingSenderId: "790537497506",
      projectId: "respawnd1-45021",
      authDomain: "respawnd1-45021.firebaseapp.com",
      storageBucket: "respawnd1-45021.firebasestorage.app",
    });
    const functions = getFunctions(app);
    const getShare = httpsCallable(functions, "getReferralShare");
    const respond = httpsCallable(functions, "respondToReferralShare");

    const root = document.getElementById("app");
    const token = (() => {
      const parts = window.location.pathname.split("/").filter(Boolean);
      const i = parts.indexOf("referral");
      return i === -1 || i + 1 >= parts.length ? null : decodeURIComponent(parts[i + 1]);
    })();

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
    const safeHttps = (u) => (typeof u === "string" && u.startsWith("https://") ? u : null);
    const dateText = (ms) => ms ? new Date(ms).toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" }) : "";
    const dateTimeText = (ms) => ms ? new Date(ms).toLocaleString("en-PH", {
      month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit",
    }) : "";
    const telHref = (n) => `tel:${String(n).replace(/[^\d+]/g, "")}`;

    function center(html) {
      root.innerHTML = `<div class="center-screen"><div>${html}</div></div>`;
    }

    function row(k, v) {
      return v ? `<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>` : "";
    }

    function closedScreen(title, body, org) {
      const contact = org && (org.phone || org.email)
        ? `<div class="btns" style="justify-content:center">
             ${org.phone ? `<a class="btn" href="${esc(telHref(org.phone))}">Call ${esc(org.name || "the organization")}</a>` : ""}
             ${org.email ? `<a class="btn" href="mailto:${esc(org.email)}">Email</a>` : ""}
           </div>` : "";
      center(`<h1 style="margin-bottom:8px">${esc(title)}</h1><p class="muted">${esc(body)}</p>${contact}`);
    }

    function render(data) {
      const s = data.snapshot || {};
      const org = s.organization || {};
      const ref = s.referral || {};
      const loc = s.location || {};
      const urgency = (s.urgency || "").toLowerCase();
      const animals = Array.isArray(s.animals) ? s.animals : [];
      const photos = (s.photoUrls || []).map(safeHttps).filter(Boolean);
      const videos = (s.videoUrls || []).map(safeHttps).filter(Boolean);
      const mapsUrl = typeof loc.lat === "number" && typeof loc.lng === "number"
        ? `https://www.google.com/maps/search/?api=1&query=${loc.lat},${loc.lng}`
        : loc.address ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc.address)}` : null;
      const fb = safeHttps(org.facebookUrl);
      const options = data.responseOptions || {};

      root.innerHTML = `
        <div class="brand">ResPAWnd · ${esc(org.name || "Animal rescue")}</div>
        <h1>Rescue referral</h1>
        <p class="muted" style="margin:6px 0 0">
          ${esc(org.name || "An animal rescue organization")} is asking for your help with this report.
          Case ${esc(s.caseRef || "")}.
        </p>
        <div class="chips">
          <span class="chip status">${esc(data.statusLabel || "Referred")}</span>
          ${s.urgency ? `<span class="chip ${urgency === "critical" ? "critical" : urgency === "medium" ? "medium" : ""}">${esc(s.urgency)} urgency</span>` : ""}
          ${s.rescueType ? `<span class="chip">${esc(s.rescueType)}</span>` : ""}
        </div>

        <div class="card">
          <h2>Why it was referred</h2>
          ${row("Referred to", ref.barangay)}
          ${row("Reason", ref.reason)}
          ${row("Details", ref.explanation)}
          ${row("Referred", [dateText(ref.referredAtMs), ref.referredByName ? `by ${ref.referredByName}` : ""].filter(Boolean).join(" "))}
          ${row("Reported", dateTimeText(s.reportedAtMs))}
        </div>

        ${photos.length || videos.length ? `
        <div class="card">
          <h2>Photos${videos.length ? " and videos" : ""}</h2>
          ${photos.length ? `<div class="photos">${photos.map((u) =>
            `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Reported animal" loading="lazy" /></a>`).join("")}</div>` : ""}
          ${videos.map((u) => `<video src="${esc(u)}" controls preload="metadata"></video>`).join("")}
        </div>` : ""}

        <div class="card">
          <h2>${animals.length > 1 ? `The animals (${animals.length})` : "The animal"}</h2>
          ${animals.length ? animals.map((a) => `
            <div class="animal">
              ${row("Species", a.species)}${row("Breed", a.breed)}${row("Sex", a.sex)}${row("Size", a.size)}
              ${row("Color", a.colorMarkings)}${row("Body", a.bodyCondition)}${row("Mobility", a.mobility)}
              ${row("Behavior", a.behavior)}
            </div>`).join("") : row("Species", s.species || "Not stated")}
          ${row("Condition", s.condition)}
          ${row("Bite risk", s.biteRisk)}
          ${row("Escape risk", s.escapeRisk)}
          ${row("Contained", s.containmentStatus)}
          ${row("Handling", s.handlingNotes)}
        </div>

        <div class="card">
          <h2>Where</h2>
          ${row("Address", loc.address || (mapsUrl ? "Pinned on the map" : "Not given"))}
          ${row("Getting there", s.accessInstructions)}
          ${mapsUrl ? `<div class="btns"><a class="btn primary" href="${esc(mapsUrl)}" target="_blank" rel="noopener">Open in Google Maps</a></div>` : ""}
        </div>

        ${s.reporter && (s.reporter.name || s.reporter.phone) ? `
        <div class="card">
          <h2>Person who reported it</h2>
          ${row("Name", s.reporter.name)}
          ${row("Phone", s.reporter.phone)}
          ${s.reporter.phone ? `<div class="btns"><a class="btn" href="${esc(telHref(s.reporter.phone))}">Call reporter</a></div>` : ""}
        </div>` : ""}

        <div class="card">
          <h2>Contact ${esc(org.name || "the organization")}</h2>
          ${row("Phone", org.phone)}
          ${row("Email", org.email)}
          <div class="btns">
            ${org.phone ? `<a class="btn" href="${esc(telHref(org.phone))}">Call</a>` : ""}
            ${org.email ? `<a class="btn" href="mailto:${esc(org.email)}?subject=${encodeURIComponent(`Rescue referral ${s.caseRef || ""}`)}">Email</a>` : ""}
            ${fb ? `<a class="btn" href="${esc(fb)}" target="_blank" rel="noopener">Facebook</a>` : ""}
          </div>
        </div>

        <div class="card" id="answer-card">
          <h2>Can you take this case?</h2>
          <p class="muted" style="margin:0 0 8px">Your answer goes straight to ${esc(org.name || "the organization")}.</p>
          <form id="answer-form" novalidate>
            <div class="choice">
              ${Object.entries(options).map(([key, label]) => `
                <label><input type="radio" name="response" value="${esc(key)}" /> ${esc(label)}</label>`).join("")}
            </div>
            <label class="field"><span>Your name or office *</span>
              <input name="name" maxlength="120" autocomplete="organization" placeholder="e.g. Brgy. San Isidro – Juan Dela Cruz" /></label>
            <label class="field"><span>Phone or email (optional)</span>
              <input name="contact" maxlength="80" autocomplete="tel" /></label>
            <label class="field"><span id="note-label">Note</span>
              <textarea name="note" maxlength="1000"></textarea></label>
            <div id="form-msg"></div>
            <button class="btn primary" type="submit" style="width:100%">Send answer</button>
          </form>
        </div>

        ${(data.responses || []).length ? `
        <div class="card">
          <h2>Answers so far</h2>
          ${data.responses.map((r) => `
            <div class="answer">
              <div><strong>${esc(r.label)}</strong> · ${esc(r.name)}</div>
              ${r.note ? `<div class="muted" style="white-space:pre-line">${esc(r.note)}</div>` : ""}
              <div class="muted" style="font-size:14px">${esc(dateTimeText(r.atMs))}</div>
            </div>`).join("")}
        </div>` : ""}

        <p class="foot">This link was shared by ${esc(org.name || "the organization")} through ResPAWnd and stays open until ${esc(dateText(data.expiresAtMs))}.</p>
      `;
      wireForm();
    }

    function wireForm() {
      const form = document.getElementById("answer-form");
      const msg = document.getElementById("form-msg");
      const noteLabel = document.getElementById("note-label");
      form.addEventListener("change", () => {
        const choice = form.response.value;
        noteLabel.textContent = choice === "cannot_handle" ? "Why you can't take it *"
          : choice === "need_info" ? "What you need to know *" : "Note";
      });
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
          token,
          response: form.response.value,
          name: form.name.value.trim(),
          contact: form.contact.value.trim(),
          note: form.note.value.trim(),
        };
        if (!payload.response) return (msg.innerHTML = `<p class="error">Choose an answer.</p>`);
        if (!payload.name) return (msg.innerHTML = `<p class="error">Enter your name or office.</p>`);
        if (payload.response !== "will_handle" && !payload.note) {
          return (msg.innerHTML = `<p class="error">${payload.response === "cannot_handle"
            ? "Say why you can't take it." : "Say what information you need."}</p>`);
        }
        const button = form.querySelector("button");
        button.disabled = true;
        msg.innerHTML = "";
        try {
          await respond(payload);
          await load({ thanks: true });
        } catch (err) {
          button.disabled = false;
          msg.innerHTML = `<p class="error">${esc(err?.message || "Could not send your answer. Please try again.")}</p>`;
        }
      });
    }

    async function load({ thanks = false } = {}) {
      try {
        const { data } = await getShare({ token });
        if (data.state === "revoked") {
          return closedScreen("This link is closed", "The organization stopped sharing this referral. Contact them if you still need the details.", data.organization);
        }
        if (data.state === "expired") {
          return closedScreen("This link has expired", "Ask the organization for a new link if you still need the details.", data.organization);
        }
        render(data);
        if (thanks) {
          const card = document.getElementById("answer-card");
          card.insertAdjacentHTML("afterbegin", `<p class="success">Thank you. Your answer was sent.</p>`);
          card.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      } catch (err) {
        console.error("Referral load failed:", err);
        if ((err?.code || "").includes("not-found")) {
          return closedScreen("Link not found", "This referral link isn't valid. Check that you opened the whole link.");
        }
        center(`<h1 style="margin-bottom:8px">Something went wrong</h1>
          <p class="muted">Could not load this referral. Check your connection and reload the page.</p>
          <div class="btns" style="justify-content:center"><button class="btn" onclick="location.reload()">Reload</button></div>`);
      }
    }

    if (!token) {
      closedScreen("Link not found", "This referral link isn't valid. Check that you opened the whole link.");
    } else {
      center(`<div class="spinner"></div><p class="muted">Loading the referral…</p>`);
      load();
    }
</script>
</body>
</html>
