<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Pet Found — ResPAWnd</title>
    <link rel="icon" href="/favicon.png" />
    <style>
        :root {
          --background: #FBF9F4;
          --yellow: #FFD95E;
          --green: #C2B500;
          --lavender: #AEB7FF;
          --slate: #D9D9D9;
          --tea: #E3E0B9;
          --text-primary: #393207;
          --text-secondary: #7E7D76;
          --surface: #FFFFFF;
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          background: var(--background);
          color: var(--text-primary);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
          -webkit-font-smoothing: antialiased;
        }
        .wrap {
          max-width: 480px;
          margin: 0 auto;
          padding: 24px 20px 40px;
          min-height: 100vh;
        }
        .center-screen {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 24px;
        }
        h1.title {
          text-align: center;
          font-size: 28px;
          font-weight: 800;
          margin: 4px 0 18px;
        }
        .photo {
          width: 140px;
          height: 140px;
          border-radius: 12px;
          background: var(--tea);
          margin: 0 auto;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          font-size: 44px;
        }
        .photo img { width: 100%; height: 100%; object-fit: cover; }
        .pet-name {
          text-align: center;
          font-size: 22px;
          font-weight: 800;
          margin: 10px 0 8px;
        }
        hr.divider {
          border: none;
          border-top: 0.5px solid var(--text-primary);
          opacity: 0.4;
          margin: 8px 0;
        }
        p.msg {
          text-align: center;
          font-size: 13.5px;
          margin: 8px 0 4px;
          line-height: 1.4;
        }
        p.location-label {
          text-align: center;
          font-size: 13.5px;
          font-weight: 700;
          margin: 0 0 18px;
        }
        .contact-row {
          display: flex;
          align-items: center;
          justify-content: flex-start;
          gap: 10px;
          margin-bottom: 8px;
        }
        .contact-row .label {
          font-weight: 700;
          font-size: 14px;
        }
        .icon-btn {
          background: none;
          border: none;
          cursor: pointer;
          color: var(--text-secondary);
          font-size: 16px;
          padding: 2px;
        }
        .chat-box {
          height: 260px;
          background: var(--surface);
          border: 1px solid var(--slate);
          border-radius: 12px;
          padding: 10px;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }
        .chat-empty-state {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          color: var(--text-secondary);
          font-size: 13px;
          padding: 0 16px;
        }
        .chat-thread {
          flex: 1;
          overflow-y: auto;
          display: flex;
          flex-direction: column-reverse;
          gap: 6px;
        }
        .bubble {
          max-width: 78%;
          padding: 8px 12px;
          border-radius: 14px;
          font-size: 13.5px;
          margin: 3px 0;
        }
        .bubble.finder { align-self: flex-end; background: var(--yellow); }
        .bubble.owner { align-self: flex-start; background: rgba(227, 224, 185, 0.5); }
        .compose-row {
          display: flex;
          gap: 8px;
          margin-top: 8px;
        }
        .compose-row input {
          flex: 1;
          border: 1px solid var(--slate);
          border-radius: 20px;
          padding: 10px 14px;
          font-size: 14px;
          background: var(--background);
          color: var(--text-primary);
        }
        .compose-row button {
          border: none;
          background: none;
          color: var(--text-primary);
          font-size: 22px;
          cursor: pointer;
          padding: 0 6px;
        }
        .primary-btn {
          display: block;
          width: 100%;
          padding: 16px;
          border: none;
          border-radius: 30px;
          background: var(--yellow);
          color: var(--text-primary);
          font-weight: 800;
          font-size: 15px;
          cursor: pointer;
          margin-top: 12px;
        }
        .spinner {
          width: 28px;
          height: 28px;
          border-radius: 50%;
          border: 3px solid var(--slate);
          border-top-color: var(--text-primary);
          animation: spin 0.8s linear infinite;
          margin: 0 auto 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .badge-circle {
          width: 110px;
          height: 110px;
          border-radius: 50%;
          background: var(--text-primary);
          border: 4px solid var(--lavender);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 42px;
          margin: 0 auto 20px;
        }
        .small-note {
          font-size: 12px;
          color: var(--text-secondary);
          font-style: italic;
          text-align: center;
        }
    </style>
</head>
<body>
<div id="app" class="wrap"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, signInAnonymously, onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, doc, onSnapshot, collection, addDoc,
      query, orderBy, serverTimestamp,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      getFunctions, httpsCallable,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

    // Same web config as lib/firebase_options.dart (DefaultFirebaseOptions.web).
    const firebaseConfig = {
      apiKey: "AIzaSyCJcdSf3qyq9C-JRByBWxxnyE6Kp37XLtE",
      appId: "1:790537497506:web:797389d4b5f5664726e0fb",
      messagingSenderId: "790537497506",
      projectId: "respawnd1-45021",
      authDomain: "respawnd1-45021.firebaseapp.com",
      storageBucket: "respawnd1-45021.firebasestorage.app",
      measurementId: "G-6XR8KHPL1B",
    };

    // Same key already embedded client-side in scan_tag_flow.dart — reused
    // here rather than introducing a second exposed key.
    const GEOCODING_API_KEY = "AIzaSyChQ9xBxn59vAehhzsPuMgCqJoW_qbVOs0";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const functions = getFunctions(app);

    const root = document.getElementById("app");

    function tagIdFromPath() {
      const segments = window.location.pathname.split("/").filter(Boolean);
      const i = segments.indexOf("tag");
      if (i === -1 || i + 1 >= segments.length) return null;
      return decodeURIComponent(segments[i + 1]);
    }

    function renderCenter(html) {
      root.innerHTML = `<div class="center-screen"><div>${html}</div></div>`;
    }

    function escapeHtml(s) {
      return (s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    // Best-effort device location — never blocks the flow if denied/slow.
    function getBrowserLocation() {
      return new Promise((resolve) => {
        if (!("geolocation" in navigator)) return resolve(null);
        const timer = setTimeout(() => resolve(null), 8000);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            clearTimeout(timer);
            resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
          },
          () => {
            clearTimeout(timer);
            resolve(null);
          },
          { enableHighAccuracy: false, timeout: 8000 },
        );
      });
    }

    async function reverseGeocode(lat, lng) {
      try {
        const url = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${GEOCODING_API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.status === "OK" && data.results && data.results.length) {
          return data.results[0].formatted_address ?? null;
        }
      } catch (_) {}
      return null;
    }

    function formatDate(ts) {
      if (!ts) return "";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      let h = d.getHours() % 12; if (h === 0) h = 12;
      const ampm = d.getHours() < 12 ? "AM" : "PM";
      const min = String(d.getMinutes()).padStart(2, "0");
      return `${months[d.getMonth()]} ${d.getDate()}, ${h}:${min} ${ampm}`;
    }

    function launchTel(number) {
      if (number) window.location.href = `tel:${number}`;
    }
    function launchMail(email, petName) {
      if (!email) return;
      const subject = encodeURIComponent(`Found ${petName || "your pet"}`);
      window.location.href = `mailto:${email}?subject=${subject}`;
    }
    function launchFacebook(link) {
      if (!link) return;
      const normalized = /^https?:\/\//i.test(link) ? link : `https://${link}`;
      window.open(normalized, "_blank", "noopener");
    }

    let messagesUnsub = null;

    function renderFoundScreen({ tagId, sessionId, tagData, sessionData }) {
      const petName = tagData?.name || "";
      const petImageUrl = tagData?.petImageUrl || "";
      const ownerMobile = (tagData?.ownerMobile || "").trim();
      const ownerEmail = (tagData?.ownerEmail || "").trim();
      const ownerFacebookLink = (tagData?.ownerFacebookLink || "").trim();

      const status = sessionData?.status || "active";

      if (status === "resolved") {
        root.innerHTML = `
          <div class="wrap">
            <div style="min-height:80vh; display:flex; flex-direction:column; justify-content:center;">
              <h1 class="title">Rescue Completed!</h1>
              <div class="badge-circle">🐾</div>
              <p class="msg" style="font-weight:700;">The pet has been safely returned to its owner.</p>
              <p class="msg" style="color:var(--text-secondary);">Thank you for making this rescue successful. Every successful reunion helps create a safer community for pets and their owners.</p>
              <p class="small-note">This rescue session has now ended. The temporary chat has been closed.</p>
            </div>
          </div>`;
        return;
      }

      const chatEnabled = !!sessionData?.chatEnabledByOwner;
      const lat = sessionData?.lat;
      const lng = sessionData?.lng;
      const address = sessionData?.address;
      const createdAt = sessionData?.createdAt;

      const locationLabel = address
        ? address
        : (lat != null && lng != null)
          ? `${lat.toFixed(4)}, ${lng.toFixed(4)}`
          : "Location not shared";
      const timeLabel = formatDate(createdAt);

      root.innerHTML = `
        <div class="wrap">
          <h1 class="title">Pet Found!</h1>
          <div class="photo">
            ${petImageUrl
              ? `<img src="${escapeHtml(petImageUrl)}" onerror="this.parentElement.textContent='🐾'" />`
              : "🐾"}
          </div>
          <div class="pet-name">${escapeHtml(petName) || "—"}</div>
          <hr class="divider" />
          <p class="msg">Thanks for helping! We've notified ${escapeHtml(petName) || "the pet"}'s owner. Here's where you scanned the tag:</p>
          <p class="location-label">${escapeHtml(locationLabel)}${timeLabel ? " | " + timeLabel : ""}</p>

          <div class="contact-row">
            <span class="label">Enable Live-Chat</span>
            ${ownerMobile ? `<button class="icon-btn" id="btn-call" title="Call">📞</button>` : ""}
            ${ownerFacebookLink ? `<button class="icon-btn" id="btn-fb" title="Facebook">📘</button>` : ""}
            ${ownerEmail ? `<button class="icon-btn" id="btn-mail" title="Email">✉️</button>` : ""}
          </div>

          <div class="chat-box">
            ${chatEnabled
              ? `<div id="chat-thread" class="chat-thread"></div>`
              : `<div class="chat-empty-state">Waiting for ${escapeHtml(petName) || "the pet"}'s owner to enable live chat…</div>`}
          </div>

          ${chatEnabled ? `
            <div class="compose-row">
              <input id="msg-input" type="text" placeholder="Type a message" />
              <button id="btn-send" title="Send">➤</button>
            </div>` : ""}
        </div>`;

      document.getElementById("btn-call")?.addEventListener("click", () => launchTel(ownerMobile));
      document.getElementById("btn-fb")?.addEventListener("click", () => launchFacebook(ownerFacebookLink));
      document.getElementById("btn-mail")?.addEventListener("click", () => launchMail(ownerEmail, petName));

      if (messagesUnsub) { messagesUnsub(); messagesUnsub = null; }

      if (chatEnabled) {
        const messagesQuery = query(
          collection(db, "rescueSessions", sessionId, "messages"),
          orderBy("sentAt"),
        );
        messagesUnsub = onSnapshot(messagesQuery, (snap) => {
          const thread = document.getElementById("chat-thread");
          if (!thread) return;
          const docs = snap.docs.slice().reverse(); // newest first, container is column-reverse
          thread.innerHTML = docs.map((d) => {
            const m = d.data();
            const who = m.sender === "finder" ? "finder" : "owner";
            return `<div class="bubble ${who}">${escapeHtml(m.text || "")}</div>`;
          }).join("");
        });

        const sendBtn = document.getElementById("btn-send");
        const input = document.getElementById("msg-input");
        const send = async () => {
          const text = (input.value || "").trim();
          if (!text) return;
          input.value = "";
          try {
            await addDoc(collection(db, "rescueSessions", sessionId, "messages"), {
              sender: "finder",
              text,
              sentAt: serverTimestamp(),
            });
          } catch (_) {
            alert("Could not send message. Please try again.");
          }
        };
        sendBtn?.addEventListener("click", send);
        input?.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
      }
    }

    async function main() {
      const tagId = tagIdFromPath();
      if (!tagId) {
        renderCenter(`
          <div class="photo" style="margin-bottom:16px;">🔍</div>
          <h2>No Pet Found</h2>
          <p class="msg" style="color:var(--text-secondary);">This link isn't linked to a registered collar tag.</p>
        `);
        return;
      }

      renderCenter(`<div class="spinner"></div><p class="msg">Looking up this tag…</p>`);

      try {
        // Anonymous auth mirrors the "finder" role the app already grants
        // any signed-in-but-non-owner user — see resolveScannedTagId in
        // scan_tag_flow.dart. Firestore rules must allow any authenticated
        // user (not just non-anonymous ones) to read collarTags/{tagId},
        // read/write rescueSessions/{sessionId}, and its messages
        // subcollection, exactly as they already do for in-app finders.
        await new Promise((resolve, reject) => {
          onAuthStateChanged(auth, (user) => {
            if (user) return resolve(user);
          });
          signInAnonymously(auth).catch(reject);
        });

        const location = await getBrowserLocation();
        let address = null;
        if (location) {
          address = await reverseGeocode(location.lat, location.lng);
        }

        const getOrCreateRescueSession = httpsCallable(functions, "getOrCreateRescueSession");
        const result = await getOrCreateRescueSession({
          tagId,
          ...(location ? { location: { ...location, ...(address ? { address } : {}) } } : {}),
        });

        const sessionId = result.data?.sessionId;
        if (!sessionId) throw new Error("no-session");

        let tagData = null;
        let sessionData = null;
        const rerender = () => {
          if (tagData && sessionData) {
            renderFoundScreen({ tagId, sessionId, tagData, sessionData });
          }
        };

        onSnapshot(doc(db, "collarTags", tagId), (snap) => {
          tagData = snap.data() || {};
          rerender();
        });
        onSnapshot(doc(db, "rescueSessions", sessionId), (snap) => {
          sessionData = snap.data() || {};
          rerender();
        });
      } catch (err) {
        const code = err?.code || "";
        if (code.includes("not-found")) {
          renderCenter(`
            <div class="photo" style="margin-bottom:16px;">🔍</div>
            <h2>No Pet Found</h2>
            <p class="msg" style="color:var(--text-secondary);">This code isn't linked to a registered collar tag. It may be damaged, unregistered, or from outside ResPAWnd.</p>
          `);
        } else {
          renderCenter(`
            <h2>Something went wrong</h2>
            <p class="msg" style="color:var(--text-secondary);">Could not process this scan. Please check your connection and reload this page.</p>
          `);
        }
      }
    }

    main();
</script>
</body>
</html>
