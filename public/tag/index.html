<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResPAWnd — Pet Identification Card</title>
    <style>
        :root {
          --background: #FBF9F4;
          --yellow: #FFD95E;
          --green: #C2B500;
          --lavender: #AEB7FF;
          --slate: #D9D9D9;
          --tea: #E3E0B9;
          --text-primary: #393207;
          --text-secondary: #7E7D76;
          --surface: #FFFFFF;
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: var(--background);
          color: var(--text-primary);
          display: flex;
          justify-content: center;
          padding: 20px 16px 40px;
        }
        .card { width: 100%; max-width: 420px; }

        .topbar { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
        .back-btn {
          flex-shrink: 0; width: 34px; height: 34px;
          border: 2px solid var(--text-primary); border-radius: 8px;
          background: transparent; display: flex; align-items: center; justify-content: center;
          font-size: 18px; font-weight: 700; color: var(--text-primary);
          cursor: pointer; text-decoration: none;
        }
        .title { text-align: center; font-size: 26px; font-weight: 800; line-height: 1.15; margin: 2px 0 0; }

        .notice { font-size: 14px; line-height: 1.5; color: var(--text-primary); margin-bottom: 16px; }
        .badge {
            display: inline-block;
            background: var(--yellow);
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
         }

        .photo-wrap { display: flex; justify-content: center; margin: 6px 0 18px; }
        .photo { width: 170px; height: 170px; object-fit: cover; border-radius: 16px; background: var(--tea); }
        .photo-fallback {
          width: 170px; height: 170px; border-radius: 16px;
          display: flex; align-items: center; justify-content: center;
          background: var(--tea); font-size: 56px;
        }

        .pet-name { text-align: center; font-size: 26px; font-weight: 800; margin: 0 0 18px; }

        .row {
          display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
          padding: 10px 0; border-bottom: 1px solid var(--slate); font-size: 14px;
        }
        .row .label { font-weight: 600; }
        .row .value { text-align: right; }
        .row.split { gap: 24px; }
        .row.split .pair { display: flex; gap: 6px; align-items: baseline; flex: 1; }
        .row.split .pair .label { white-space: nowrap; }

        .checklist {
          display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
          margin: 16px 0 4px; font-size: 14px;
        }
        .checklist .item { display: flex; align-items: flex-start; gap: 8px; }
        .checklist .dot { width: 8px; height: 8px; min-width: 8px; border-radius: 50%; background: var(--text-primary); margin-top: 6px; }

        .section-title { font-size: 15px; font-weight: 800; margin: 22px 0 10px; }
        .owner-row { font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--slate); }
        .owner-hidden {
          font-size: 13.5px; color: var(--text-secondary);
          background: var(--background); border: 1px solid var(--slate);
          border-radius: 10px; padding: 12px; line-height: 1.4;
        }

        .chat-label { font-size: 14px; font-weight: 800; margin: 20px 0 8px; }
        .chat-box {
          background: var(--surface); border: 1px solid var(--slate); border-radius: 12px;
          padding: 10px; min-height: 160px; max-height: 260px; overflow-y: auto;
          display: flex; flex-direction: column; gap: 6px;
        }
        .chat-empty { margin: auto; color: var(--text-secondary); font-size: 13px; text-align: center; }
        .msg {
          max-width: 80%; padding: 8px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.35;
        }
        .msg.finder { align-self: flex-start; background: rgba(227,224,185,0.6); }
        .msg.owner { align-self: flex-end; background: var(--yellow); }
        .chat-input-row { display: flex; gap: 8px; margin-top: 8px; }
        .chat-input {
          flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid var(--slate);
          background: var(--background); font-size: 14px; font-family: inherit;
        }
        .chat-send {
          border: none; background: var(--text-primary); color: var(--background);
          width: 40px; height: 40px; border-radius: 50%; font-size: 16px; cursor: pointer;
        }
        .chat-waiting { text-align: center; color: var(--text-secondary); font-size: 13px; padding: 12px 0; }

        .cta {
          display: block; text-align: center; text-decoration: none;
          background: var(--yellow); color: var(--text-primary); font-weight: 800;
          padding: 15px; border-radius: 30px; margin-top: 22px; font-size: 15.5px;
        }
        .cta.secondary { background: transparent; border: 1px solid var(--text-primary); margin-top: 10px; }
        .cta.disabled { opacity: 0.4; pointer-events: none; }

        .state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .state .icon { font-size: 40px; margin-bottom: 10px; }
        .footer { text-align: center; font-size: 12px; color: var(--text-secondary); margin-top: 22px; }
    </style>
</head>
<body>
<div class="card" id="card">
    <div class="state" id="loading"><div class="icon">🐾</div>Loading pet ID tag…</div>
</div>

<!-- Firebase (compat) SDKs — client-side, no auth required for finders -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-functions-compat.js"></script>
<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCJcdSf3qyq9C-JRByBWxxnyE6Kp37XLtE",
      appId: "1:790537497506:web:797389d4b5f5664726e0fb",
      messagingSenderId: "790537497506",
      projectId: "respawnd1-45021",
      authDomain: "respawnd1-45021.firebaseapp.com",
      storageBucket: "respawnd1-45021.firebasestorage.app",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    // Session creation and message sending go through callables (below)
    // instead of direct Firestore writes — this page has no signed-in
    // user, so any direct write would need Firestore rules open to
    // anonymous callers. Reads/listening stay direct Firestore calls.
    const functions = firebase.functions();
    const getOrCreateRescueSessionFn = functions.httpsCallable('getOrCreateRescueSession');
    const sendRescueSessionMessageFn = functions.httpsCallable('sendRescueSessionMessage');

    function tagIdFromPath() {
      const parts = window.location.pathname.split("/").filter(Boolean);
      return parts.length >= 2 ? decodeURIComponent(parts[1]) : null;
    }

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function renderState(icon, message) {
      document.getElementById("card").innerHTML = `<div class="state"><div class="icon">${icon}</div>${message}</div>`;
    }

    let messagesUnsub = null;
    let sessionUnsub = null;

    function renderMessages(docs, chatBoxEl) {
      if (docs.length === 0) {
        chatBoxEl.innerHTML = `<div class="chat-empty">No messages yet. Say hello!</div>`;
        return;
      }
      chatBoxEl.innerHTML = docs.map(d => {
        const m = d.data();
        const who = m.sender === "owner" ? "owner" : "finder";
        return `<div class="msg ${who}">${escapeHtml(m.text)}</div>`;
      }).join("");
      chatBoxEl.scrollTop = chatBoxEl.scrollHeight;
    }

    function wireChat(sessionRef, sessionId) {
      const chatBox = document.getElementById("chatBox");
      const input = document.getElementById("chatInput");
      const sendBtn = document.getElementById("chatSend");
      if (!chatBox) return;

      if (messagesUnsub) messagesUnsub();
      messagesUnsub = sessionRef.collection("messages").orderBy("sentAt")
        .onSnapshot(qs => renderMessages(qs.docs, chatBox));

      if (sendBtn) {
        sendBtn.onclick = () => {
          const text = input.value.trim();
          if (!text) return;
          input.value = "";
          sendRescueSessionMessageFn({sessionId, sender: "finder", text}).catch((e) => {
            console.error("ResPAWnd: could not send message", e);
            input.value = text; // let them retry instead of silently losing it
          });
        };
        input.onkeydown = (e) => { if (e.key === "Enter") sendBtn.click(); };
      }
    }

    function chatSectionHtml(session) {
      const enabled = session.chatEnabledByOwner === true;
      return `
        <div class="chat-label">Live Chat with Owner</div>
        <div class="chat-box" id="chatBox"><div class="chat-empty">Loading…</div></div>
        ${enabled
          ? `<div class="chat-input-row">
               <input class="chat-input" id="chatInput" placeholder="Type a message" />
               <button class="chat-send" id="chatSend">➤</button>
             </div>`
          : `<div class="chat-waiting">Waiting for the owner to enable live chat…</div>`}
      `;
    }

    function getLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
          () => resolve(null),
          { timeout: 4000 }
        );
      });
    }

    // Session creation happens server-side (see getOrCreateRescueSession in
    // functions/index.js) instead of writing rescueSessions/collarTags
    // directly from here — this page has no signed-in user at all, so a
    // direct client write depends on Firestore rules allowing anonymous
    // writes to those collections. Rather than opening that up (anyone who
    // knows a tag ID — visible right in the QR-code URL — could otherwise
    // write to it), the callable does this under admin privileges and
    // hands back just the session ID. Reading/listening to that session
    // afterward is still a plain Firestore read, unaffected by this.
    async function getOrCreateSession(tagId, tag) {
      try {
        const loc = await getLocation();
        const result = await getOrCreateRescueSessionFn({
          tagId,
          location: loc ? {lat: loc.lat, lng: loc.lng} : null,
        });
        const sessionId = result && result.data && result.data.sessionId;
        if (!sessionId) return null;
        return db.collection("rescueSessions").doc(sessionId);
      } catch (e) {
        // Most likely cause here is the callable itself rejecting the
        // request (tag not found, or qrEnabled still false) rather than a
        // permissions issue, since this call no longer depends on
        // Firestore security rules for writes at all.
        console.error("ResPAWnd: could not create/reuse a rescue session via the callable.", e);
        window.__resPawndSessionError = e;
        return null;
      }
    }

    function renderTag(tagId, tag, sessionRef) {
      const photo = tag.petImageUrl
        ? `<img class="photo" src="${escapeHtml(tag.petImageUrl)}" alt="${escapeHtml(tag.name)}" />`
        : `<div class="photo-fallback">🐶</div>`;

      const allergiesLine = tag.allergies && tag.allergies.toLowerCase() !== "none"
        ? `Allergies: ${escapeHtml(tag.allergies)}` : "No Allergies";
      const medicalLine = tag.medicalCondition && tag.medicalCondition.toLowerCase() !== "none"
        ? `Medical Condition: ${escapeHtml(tag.medicalCondition)}` : "No Medical Condition";
      const spayedLine = tag.isSpayedNeutered ? "Spayed" : "Not Spayed/Neutered";
      const vaccinatedLine = tag.isVaccinated ? "Vaccinated" : "Not Vaccinated";

      const isLost = tag.status === "lost";

      const title = isLost ? "ResPAWnd - Pet Found!" : "ResPAWnd - Pet Identification Card";
      const badge = isLost
        ? `The owner has been notified that their pet's tag was scanned. Please
           provide the exact location or address where the pet was found to
           help facilitate a safe reunion.`
        : `This is ${escapeHtml(tag.name || "this pet")}'s ID tag. You can message
           the owner below if needed.`;

      const ownerSection = isLost
        ? `<div class="section-title">Owner Information</div>
           <div class="owner-row">${escapeHtml(tag.ownerName || "—")}</div>
           <div class="owner-row">${escapeHtml(tag.ownerMobile || "—")}</div>`
        : `<div class="section-title">Owner Information</div>
           <div class="owner-hidden">Hidden unless the owner marks this pet as lost. Use the chat below to reach them.</div>`;

      const callBtn = (isLost && tag.ownerMobile)
        ? `<a class="cta" href="tel:${escapeHtml(tag.ownerMobile)}">Contact Owner</a>`
        : `<div class="cta disabled">Contact Owner</div>`;

      document.getElementById("card").innerHTML = `
        <div class="topbar">
          <div class="title">${title}</div>
        </div>

        <div class="badge">${badge}</div>

        <div class="photo-wrap">${photo}</div>
        <div class="pet-name">${escapeHtml(tag.name || "Unnamed pet")}</div>

        <div class="row"><div class="label">Breed:</div><div class="value">${escapeHtml(tag.breed || "—")}</div></div>
        <div class="row"><div class="label">Color/Markings:</div><div class="value">${escapeHtml(tag.colorMarkings || "—")}</div></div>
        <div class="row split">
          <div class="pair"><div class="label">Birthday:</div><div class="value">${escapeHtml(tag.birthday || "—")}</div></div>
          <div class="pair"><div class="label">Sex:</div><div class="value">${escapeHtml(tag.sex || "—")}</div></div>
        </div>

        <div class="checklist">
          <div class="item"><div class="dot"></div>${spayedLine}</div>
          <div class="item"><div class="dot"></div>${allergiesLine}</div>
          <div class="item"><div class="dot"></div>${vaccinatedLine}</div>
          <div class="item"><div class="dot"></div>${medicalLine}</div>
        </div>

        ${ownerSection}

        ${sessionRef
          ? chatSectionHtml({ chatEnabledByOwner: false })
          : (window.__resPawndSessionError
              ? `<div class="chat-waiting">Live chat couldn't be started right now. Please try again shortly.</div>`
              : "")}

        ${callBtn}
        <a class="cta secondary" href="https://play.google.com/store/apps" target="_blank" rel="noopener">Get the ResPAWnd app</a>

        <div class="footer">Powered by ResPAWnd &middot; Loved by the Gapz Animal Rescue Inc.</div>
      `;

      if (sessionRef) {
        let lastEnabled = null;
        if (sessionUnsub) sessionUnsub();
        sessionUnsub = sessionRef.onSnapshot((snap) => {
          if (!snap.exists) return;
          const session = snap.data();
          const enabled = session.chatEnabledByOwner === true;
          if (enabled === lastEnabled) return; // nothing to re-render
          lastEnabled = enabled;

          const anchor = document.querySelector(".card");
          anchor.querySelectorAll(
            ".chat-label,.chat-box,.chat-input-row,.chat-waiting"
          ).forEach(el => el.remove());

          const ctaBtn = anchor.querySelector(".cta");
          ctaBtn.insertAdjacentHTML("beforebegin", chatSectionHtml(session));
          wireChat(sessionRef, sessionRef.id);
        });
      }
    }

    async function main() {
      const tagId = tagIdFromPath();
      if (!tagId) { renderState("❓", "No tag ID was provided in this link."); return; }

      try {
        const doc = await db.collection("collarTags").doc(tagId).get();
        if (!doc.exists) { renderState("🚫", "This pet ID tag doesn't exist or was removed."); return; }

        const tag = doc.data();
        if (!tag.qrEnabled) {
          renderState("⏳", "This tag's QR code hasn't been approved for public viewing yet.");
          return;
        }

        const sessionRef = await getOrCreateSession(tagId, tag);
        renderTag(tagId, tag, sessionRef);
      } catch (e) {
        renderState("⚠️", "Couldn't load this tag right now. Please try again.");
      }
    }

    main();
</script>
</body>
</html>
