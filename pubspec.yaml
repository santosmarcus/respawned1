name: respawnd1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  firebase_messaging: ^16.1.2
  cloud_functions: ^6.0.7
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  image_picker: ^1.2.1
  video_player: ^2.9.1
  flutter_stripe: ^12.3.0  # for PayMongo integration via Stripe
  google_fonts: ^8.0.2
  http: ^1.6.0
  url_launcher: ^6.3.1
  fl_chart: ^0.69.2  # charts for the admin Analytics dashboard
  #sign in
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.5

  # UI
  lottie: ^3.3.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.0
  shimmer: ^3.0.0

  # Navigation
  go_router: ^17.1.0

  # State Management
  flutter_riverpod: ^3.2.1
  provider: ^6.1.1 # for DonationAdminProvider

  # Forms & Validation
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0

  #Scan/Write NFC and QR
  mobile_scanner: ^5.0.0
  flutter_nfc_kit: ^3.3.0
  nfc_manager: ^4.1.0
  nfc_manager_ndef: ^1.1.0
  qr_flutter: ^4.1.0

  #File sharing
  share_plus: ^13.1.0
  path_provider: ^2.1.6

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Image/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Zain
      fonts:
        - asset: assets/fonts/Zain-Regular.ttf
        - asset: assets/fonts/Zain-Bold.ttf
          weight: 700
    - family: TiltWarp
      fonts:
        - asset: assets/fonts/TiltWarp-Regular.ttf
